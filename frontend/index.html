<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>创想悦动AI决策大脑</title>
    <style>
      /* 首屏白屏兜底：JS 包下载/解析期间显示，React 挂载后被替换（P2-27）。 */
      #app-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #app-boot .s { width: 34px; height: 34px; border: 3px solid #e3ece8; border-top-color: #3f7565; border-radius: 50%; animation: app-boot-spin 0.8s linear infinite; }
      #app-boot .t { margin-top: 12px; color: #8c8c8c; font-size: 14px; font-family: sans-serif; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot">
        <div style="text-align: center">
          <div class="s"></div>
          <div class="t">正在加载…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
