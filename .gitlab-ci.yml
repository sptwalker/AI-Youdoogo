# The active macOS ARM64 AI runner cannot obtain DaoCloud bearer tokens with
# pull_policy=always. Use direct upstream images; the runner has demonstrated
# successful direct Docker Hub pulls in the same pipeline.
stages:
  - bootstrap
  - verify
  - build
  - scan
  - deploy
  - notify

default:
  tags:
    - AI
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - when: never

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "2"
  GET_SOURCES_ATTEMPTS: "3"
  # Immutable SWR tag. Bump it together with the Dockerfile version label;
  # the contract test keeps both values synchronized.
  DEPLOY_TOOLS_TAG: alpine3.22.1-kubectl1.31.5-r1
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  # npm cache must live inside the workspace so GitLab can archive it (paths outside
  # $CI_PROJECT_DIR are not cacheable). node_modules stays uncached; only the tarball cache is.
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  # Project-owned, non-secret delivery constants. Operators do not configure these
  # in the protected group variable contract.
  PUBLIC_HOST: ai.youdoogo.com
  CCE_ELB_ID: abab7533-a1c6-4138-a4bc-59d53e3446e2
  CCE_LISTENER_MASTER_INGRESS: nexus-prod/nexus-studio
  CCE_TLS_CERTIFICATE_IDS: 56de20421757445ea53f5af51ecb4e10
  FEISHU_OPS_CHAT_ID: oc_52174c913e452fa712e77439a07300ac

.verify_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - when: never

.delivery_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - when: never

verify_backend:
  stage: verify
  image:
    name: python:3.12-slim
    pull_policy: always
  services:
    - name: redis:7-alpine
      alias: redis
      pull_policy: always
  variables:
    REDIS_URL: redis://redis:6379/0
  extends: .verify_rules
  # uv's content-addressed download cache, keyed on the resolved lockfile. The venv
  # (.venv) is intentionally NOT cached — it is rebuilt by `uv sync` from this cache.
  cache:
    key:
      prefix: uv
      files:
        - uv.lock
    paths:
      - .cache/uv/
    policy: pull-push
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir --index-url https://pypi.tuna.tsinghua.edu.cn/simple --retries 5 --timeout 60 uv==0.11.7
  script:
    - bash scripts/ci/verify-backend-localfs.sh

verify_frontend:
  stage: verify
  image:
    name: node:20-alpine
    pull_policy: always
  extends: .verify_rules
  # npm's package (tarball) cache, keyed on the frontend lockfile. node_modules is left
  # to `npm ci` (which wipes and reinstalls it) and is never cached.
  cache:
    key:
      prefix: npm
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm/
    policy: pull-push
  script:
    - npm --prefix frontend ci
    - npm --prefix frontend run test:coverage
    - npm --prefix frontend run lint
    - npm --prefix frontend run build

verify_delivery_contract:
  stage: verify
  image:
    name: python:3.12-alpine
    pull_policy: always
  extends: .verify_rules
  before_script:
    - apk add --no-cache bash gettext nginx
    - command -v envsubst
    - command -v nginx
    - python -m pip install --no-cache-dir pytest PyYAML
  script:
    - python -m pytest -q -m delivery_contract tests/test_cce_delivery_contract.py
    - bash -n scripts/ci/deploy-cce.sh scripts/ci/bootstrap-runtime.sh scripts/ci/smoke-youdoogo.sh scripts/ci/verify-backend-localfs.sh
    - sh -n scripts/ci/trivy-image-scan.sh
    - python -m py_compile scripts/ci/render_cce.py scripts/ci/preflight_vars.py scripts/ci/notify.py

preflight_delivery:
  stage: verify
  image:
    name: python:3.12-alpine
    pull_policy: always
  extends: .delivery_rules
  script:
    - python scripts/ci/preflight_vars.py

.swr_build:
  stage: build
  image:
    name: docker:git
    pull_policy: always
  extends: .delivery_rules
  variables:
    DOCKER_HOST: unix:///runner-docker.sock
    DOCKER_BUILDKIT: "1"
    BUILDX_GIT_INFO: "0"
    # Registry cache export requires the docker-container driver. Give every Job its
    # own builder so 10 concurrent builds never race on one mutable BuildKit instance.
    BUILDX_BUILDER: "youdoogo-ci-${CI_JOB_ID}"
    BUILDKITD_CONFIG: "$CI_PROJECT_DIR/.buildkitd.toml"
  before_script:
    # The AI runner mounts the host Docker socket; no privileged DinD service is used.
    - test -n "${SWR_REGION:-}" && test -n "${SWR_REGISTRY_OVERRIDE:-}"
    - test -n "${SWR_AK:-}" && test -n "${SWR_PASSWORD:-}"
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE%/}"
    - export SWR_REGISTRY_HOST="${SWR_REGISTRY%%/*}"
    - export IMAGE_TAG="ci-${CI_COMMIT_SHA}"
    - docker info >/dev/null
    # docker-container builders do not inherit Docker Desktop daemon mirrors. Configure
    # BuildKit explicitly so Docker Hub base-image metadata/layers use reachable mirrors.
    - |
      cat > "$BUILDKITD_CONFIG" <<'EOF'
      [registry."docker.io"]
        mirrors = ["docker.m.daocloud.io", "mirror.ccs.tencentyun.com", "hub-mirror.c.163.com"]
      EOF
    - docker buildx create --name "$BUILDX_BUILDER" --driver docker-container --buildkitd-config "$BUILDKITD_CONFIG" --use
    - docker buildx inspect --bootstrap
    - printf '%s' "$SWR_PASSWORD" | docker login -u "${SWR_REGION}@${SWR_AK}" --password-stdin "$SWR_REGISTRY_HOST"
  after_script:
    - if [ -n "${SWR_REGISTRY_OVERRIDE:-}" ]; then docker logout "${SWR_REGISTRY_OVERRIDE%%/*}" >/dev/null 2>&1 || true; fi
    # Only remove this Job's builder; never prune shared image or BuildKit caches.
    - docker buildx rm "$BUILDX_BUILDER" >/dev/null 2>&1 || true

.deploy_tools_build:
  extends: .swr_build
  stage: bootstrap
  interruptible: false
  resource_group: youdoogo-deploy-tools-publish
  script:
    - |
      export DEPLOY_TOOLS_IMAGE="${SWR_REGISTRY}/youdoogo-deploy-tools:${DEPLOY_TOOLS_TAG}"
      verify_deploy_tools_image() {
        docker pull "$DEPLOY_TOOLS_IMAGE"
        actual_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$DEPLOY_TOOLS_IMAGE")"
        test "$actual_version" = "$DEPLOY_TOOLS_TAG"
        docker run --rm "$DEPLOY_TOOLS_IMAGE" sh -ec '
          command -v bash && command -v curl && command -v python3 && command -v kubectl
          python3 -c "import yaml"
          printf "%s  %s\n" "fbecbfd375b3686002c2e81d51c390172f5ffba3d6b47920d55342cb03f557af" /usr/local/bin/kubectl | sha256sum -c -
          kubectl version --client=true
        '
      }
      if docker manifest inspect "$DEPLOY_TOOLS_IMAGE" >/dev/null 2>&1; then
        echo "Immutable deploy-tools tag already exists; verifying without overwrite"
        verify_deploy_tools_image
        exit 0
      fi
      docker buildx build \
        --pull \
        --push \
        --provenance=false \
        --platform linux/amd64 \
        --file docker/ci/deploy-tools.Dockerfile \
        --tag "$DEPLOY_TOOLS_IMAGE" \
        docker/ci
      verify_deploy_tools_image

# The first dev pipeline containing a deploy-tools Dockerfile change builds the
# fixed tag before any job can try to use it. Future version bumps must change
# both this Dockerfile and DEPLOY_TOOLS_TAG.
build_deploy_tools:
  extends: .deploy_tools_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - docker/ci/deploy-tools.Dockerfile
    - when: never

# Recovery path when an immutable tag was removed from SWR: run this optional
# job from a dev delivery pipeline. It still refuses to overwrite an existing
# tag, so a content change always requires a new DEPLOY_TOOLS_TAG.
bootstrap_deploy_tools:
  extends: .deploy_tools_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE != "merge_request_event"'
    - when: never

build_backend:
  extends: .swr_build
  script:
    - docker buildx build
        --pull
        --push
        --provenance=false
        --platform linux/amd64
        --cache-from "type=registry,ref=${SWR_REGISTRY}/youdoogo-backend:buildcache"
        --cache-to "type=registry,ref=${SWR_REGISTRY}/youdoogo-backend:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
        --tag "${SWR_REGISTRY}/youdoogo-backend:${IMAGE_TAG}"
        .

build_frontend:
  extends: .swr_build
  script:
    - docker buildx build
        --pull
        --push
        --provenance=false
        --platform linux/amd64
        --file frontend/Dockerfile
        --cache-from "type=registry,ref=${SWR_REGISTRY}/youdoogo-frontend:buildcache"
        --cache-to "type=registry,ref=${SWR_REGISTRY}/youdoogo-frontend:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
        --tag "${SWR_REGISTRY}/youdoogo-frontend:${IMAGE_TAG}"
        .

.trivy_scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
    pull_policy: always
  extends: .delivery_rules
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
    TRIVY_CACHE_POLICY: pull
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SEVERITY: HIGH,CRITICAL
    TRIVY_DB_REPOSITORY: m.daocloud.io/ghcr.io/aquasecurity/trivy-db:2
    TRIVY_JAVA_DB_REPOSITORY: m.daocloud.io/ghcr.io/aquasecurity/trivy-java-db:1
  cache:
    key: "trivy-db-${CI_PROJECT_ID}"
    paths:
      - .cache/trivy/
    policy: "$TRIVY_CACHE_POLICY"
    when: always
  before_script:
    - test -n "${SWR_REGION:-}" && test -n "${SWR_REGISTRY_OVERRIDE:-}"
    - test -n "${SWR_AK:-}" && test -n "${SWR_PASSWORD:-}"
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE%/}"
    - export IMAGE_TAG="ci-${CI_COMMIT_SHA}"
    - export TRIVY_USERNAME="${SWR_REGION}@${SWR_AK}"
    - export TRIVY_PASSWORD="$SWR_PASSWORD"

scan_backend:
  extends: .trivy_scan
  variables:
    # Keep one cache writer so parallel scans cannot overwrite the same archive.
    TRIVY_CACHE_POLICY: pull-push
  resource_group: trivy-db-cache-writer
  needs:
    - job: build_backend
  script:
    - sh scripts/ci/trivy-image-scan.sh
        "${SWR_REGISTRY}/youdoogo-backend:${IMAGE_TAG}"

scan_frontend:
  extends: .trivy_scan
  needs:
    - job: build_frontend
  script:
    - sh scripts/ci/trivy-image-scan.sh
        "${SWR_REGISTRY}/youdoogo-frontend:${IMAGE_TAG}"

deploy_cce:
  stage: deploy
  image:
    name: "${SWR_REGISTRY_OVERRIDE}/youdoogo-deploy-tools:${DEPLOY_TOOLS_TAG}"
    pull_policy: always
  extends: .delivery_rules
  needs:
    - job: build_deploy_tools
      optional: true
    - job: scan_backend
    - job: scan_frontend
  variables:
    # The Docker executor pulls the private job image before before_script, so
    # reuse the existing SWR credentials for preparation-time auth. The known
    # hostname portion of SWR_REGISTRY_OVERRIDE is pinned here because Docker
    # auth keys cannot include its namespace path; no new CI variable is needed.
    DOCKER_AUTH_CONFIG: '{"auths":{"swr.cn-south-1.myhuaweicloud.com":{"username":"${SWR_REGION}@${SWR_AK}","password":"${SWR_PASSWORD}"}}}'
  retry: 0
  interruptible: false
  resource_group: youdoogo-cce-production
  environment:
    name: cce-production
    url: https://$PUBLIC_HOST/
  before_script:
    - command -v bash && command -v curl && command -v python3 && command -v kubectl
    - python3 -c 'import yaml; print(f"PyYAML {yaml.__version__}")'
    - kubectl version --client=true
    - test -n "${KUBECONFIG_CCE_B64:-}"
    - export KUBECONFIG="/tmp/youdoogo-kubeconfig-${CI_JOB_ID}"
    - umask 077
    - printf '%s' "$KUBECONFIG_CCE_B64" | base64 -d >"$KUBECONFIG"
    - test -s "$KUBECONFIG"
    - kubectl config current-context >/dev/null
    - export SWR_REGISTRY="${SWR_REGISTRY_OVERRIDE%/}"
    - export IMAGE_TAG="ci-${CI_COMMIT_SHA}"
    - export BACKEND_IMAGE="${SWR_REGISTRY}/youdoogo-backend:${IMAGE_TAG}"
    - export FRONTEND_IMAGE="${SWR_REGISTRY}/youdoogo-frontend:${IMAGE_TAG}"
  script:
    - bash scripts/ci/deploy-cce.sh
  after_script:
    - rm -f "/tmp/youdoogo-kubeconfig-${CI_JOB_ID}"

# Feishu credentials come from the `ai` group; the non-secret destination is repo-owned above.
notify_success:
  stage: notify
  image:
    name: python:3.12-slim
    pull_policy: always
  needs:
    - job: deploy_cce
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE != "merge_request_event"'
      when: on_success
    - when: never
  retry: 0
  allow_failure: true
  script:
    - python scripts/ci/notify.py success

notify_failure:
  stage: notify
  image:
    name: python:3.12-slim
    pull_policy: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE != "merge_request_event"'
      when: on_failure
    - when: never
  retry: 0
  allow_failure: true
  script:
    - python scripts/ci/notify.py failure
