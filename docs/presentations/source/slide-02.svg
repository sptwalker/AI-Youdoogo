    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1F33" flood-opacity="0.10"/></filter>
    <marker id="arrowNavy" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#173A5E"/></marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2F6FED"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#149B72"/></marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#E6772E"/></marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#D95454"/></marker>
  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">先分清三种架构视图</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">同一套实现需要从三个正交视图描述，禁止再用一张“分层图”混为一谈</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">02</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="1444" y="62">阅读规则</tspan></text><rect x="90" y="175" width="410" height="438" rx="24" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2" filter="url(#shadow)"/><circle cx="150" cy="235" r="34" fill="#2F6FED" stroke="none" stroke-width="1.5" /><text x="150" y="244" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="150" y="244">01</tspan></text><text x="202" y="246" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="29" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="202" y="246">系统运行视图</tspan></text><rect x="124" y="292" width="342" height="2" rx="0" fill="#2F6FED" stroke="none" stroke-width="0" /><circle cx="146" cy="342" r="7" fill="#2F6FED" stroke="none" stroke-width="1.5" /><text x="168" y="347" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="168" y="347">结构：四层运行链路</tspan><tspan x="168" y="369">+ 两个横切系统</tspan></text><circle cx="146" cy="422" r="7" fill="#2F6FED" stroke="none" stroke-width="1.5" /><text x="168" y="427" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="168" y="427">回答：目标如何被接收、规划、</tspan><tspan x="168" y="449">执行、治理和反馈</tspan></text><circle cx="146" cy="502" r="7" fill="#2F6FED" stroke="none" stroke-width="1.5" /><text x="168" y="507" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="168" y="507">不直接对应源码目录</tspan></text><rect x="124" y="542" width="342" height="45" rx="13" fill="#EAF2FF" stroke="none" stroke-width="0" /><text x="295" y="572" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="19" font-weight="800" fill="#2F6FED" opacity="1" ><tspan x="295" y="572">运行责任，不是目录</tspan></text><rect x="545" y="175" width="410" height="438" rx="24" fill="#FFFFFF" stroke="#7357D8" stroke-width="2" filter="url(#shadow)"/><circle cx="605" cy="235" r="34" fill="#7357D8" stroke="none" stroke-width="1.5" /><text x="605" y="244" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="605" y="244">02</tspan></text><text x="657" y="246" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="29" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="657" y="246">DDD 领域视图</tspan></text><rect x="579" y="292" width="342" height="2" rx="0" fill="#7357D8" stroke="none" stroke-width="0" /><circle cx="601" cy="342" r="7" fill="#7357D8" stroke="none" stroke-width="1.5" /><text x="623" y="347" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="623" y="347">结构：业务 Context、基础底座 Context</tspan><tspan x="623" y="369">与 Context Map</tspan></text><circle cx="601" cy="422" r="7" fill="#7357D8" stroke="none" stroke-width="1.5" /><text x="623" y="427" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="623" y="427">回答：规则、状态、数据和</tspan><tspan x="623" y="449">公开语言归谁所有</tspan></text><circle cx="601" cy="502" r="7" fill="#7357D8" stroke="none" stroke-width="1.5" /><text x="623" y="507" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="623" y="507">只对应具有独立所有权的</tspan><tspan x="623" y="529">叶子 Context</tspan></text><rect x="579" y="542" width="342" height="45" rx="13" fill="#F0ECFF" stroke="none" stroke-width="0" /><text x="750" y="572" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="19" font-weight="800" fill="#7357D8" opacity="1" ><tspan x="750" y="572">所有权边界</tspan></text><rect x="1000" y="175" width="410" height="438" rx="24" fill="#FFFFFF" stroke="#149B72" stroke-width="2" filter="url(#shadow)"/><circle cx="1060" cy="235" r="34" fill="#149B72" stroke="none" stroke-width="1.5" /><text x="1060" y="244" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="1060" y="244">03</tspan></text><text x="1112" y="246" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="29" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="1112" y="246">代码依赖视图</tspan></text><rect x="1034" y="292" width="342" height="2" rx="0" fill="#149B72" stroke="none" stroke-width="0" /><circle cx="1056" cy="342" r="7" fill="#149B72" stroke="none" stroke-width="1.5" /><text x="1078" y="347" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="1078" y="347">结构：Context 内五层</tspan><tspan x="1078" y="369">+ Platform + Bootstrap</tspan></text><circle cx="1056" cy="422" r="7" fill="#149B72" stroke="none" stroke-width="1.5" /><text x="1078" y="427" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="1078" y="427">回答：源码依赖方向和</tspan><tspan x="1078" y="449">技术实现归属</tspan></text><circle cx="1056" cy="502" r="7" fill="#149B72" stroke="none" stroke-width="1.5" /><text x="1078" y="507" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="1078" y="507">直接约束目录与 import</tspan></text><rect x="1034" y="542" width="342" height="45" rx="13" fill="#E8F8F2" stroke="none" stroke-width="0" /><text x="1205" y="572" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="19" font-weight="800" fill="#149B72" opacity="1" ><tspan x="1205" y="572">源码依赖规则</tspan></text><rect x="170" y="675" width="1260" height="100" rx="22" fill="#0B1F33" stroke="none" stroke-width="0" /><text x="800" y="716" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="800" y="716">常见错误：把运行层误建成同名大包，或把全部编排职责收进一个万能服务</tspan></text><text x="800" y="753" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="19" font-weight="400" fill="#C9D8E8" opacity="1" ><tspan x="800" y="753">三种视图要分别表达，再通过契约、端口和事件建立对应关系</tspan></text></svg>