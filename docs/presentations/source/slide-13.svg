<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="DDD 分类">
<defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1F33" flood-opacity="0.10"/></filter>
    <marker id="arrowNavy" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#173A5E"/></marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2F6FED"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#149B72"/></marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#E6772E"/></marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#D95454"/></marker>
  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">DDD 分类：业务场景域、基础底座域、Platform 与 Bootstrap</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">【目标边界】四层运行模块不是 Bounded Context；只有拥有独立语言、生命周期和写入所有权的叶子模块才是 Context</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">13</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="1444" y="62">目标边界</tspan></text><rect x="55" y="165" width="285" height="565" rx="22" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2" filter="url(#shadow)"/><rect x="55" y="165" width="285" height="70" rx="22" fill="#EAF2FF" stroke="none" stroke-width="0" /><rect x="55" y="215" width="285" height="20" rx="0" fill="#EAF2FF" stroke="none" stroke-width="0" /><text x="197.5" y="210" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#2F6FED" opacity="1" ><tspan x="197.5" y="210">业务场景域</tspan></text><text x="79" y="280" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="700" fill="#18324A" opacity="1" ><tspan x="79" y="280">提案管理</tspan><tspan x="79" y="328">会议管理</tspan><tspan x="79" y="376">运营分析</tspan></text><rect x="75" y="605" width="245" height="100" rx="14" fill="#EAF2FF" stroke="none" stroke-width="0" /><text x="197.5" y="645" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="197.5" y="645">回答：公司正在处理什么业务问题</tspan><tspan x="197.5" y="669">拥有自身业务规则、状态和事实</tspan></text><rect x="365" y="165" width="650" height="565" rx="22" fill="#FFFFFF" stroke="#7357D8" stroke-width="2" filter="url(#shadow)"/><rect x="365" y="165" width="650" height="70" rx="22" fill="#F0ECFF" stroke="none" stroke-width="0" /><rect x="365" y="215" width="650" height="20" rx="0" fill="#F0ECFF" stroke="none" stroke-width="0" /><text x="690" y="210" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#7357D8" opacity="1" ><tspan x="690" y="210">基础底座域（Foundation Context）</tspan></text><text x="389" y="280" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="700" fill="#18324A" opacity="1" ><tspan x="389" y="280">知识：Wiki 管理 / 索引 / 检索 / 语义目录 / 组织记忆</tspan><tspan x="389" y="326">组织能力：组织结构 / 专家管理 / 能力目录 / 环境投影</tspan><tspan x="389" y="372">执行：智能体执行 / 能力执行 / 工作规划 / 工作流运行 / 任务 / 交付物</tspan><tspan x="389" y="418">集成数据：连接器管理 / 连接器执行 / 受治理数据查询</tspan><tspan x="389" y="464">沟通：助理会话 / 群消息 / 协作请求</tspan><tspan x="389" y="510">治理：身份 / 访问控制 / 人工审核 / 审计 / 系统配置</tspan><tspan x="389" y="556">AI 运营：模型供应商 / 用量与预算 / 质量评估</tspan></text><rect x="385" y="605" width="610" height="100" rx="14" fill="#F0ECFF" stroke="none" stroke-width="0" /><text x="690" y="645" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="690" y="645">回答：多个业务场景共同依赖什么稳定业务能力</tspan><tspan x="690" y="669">Foundation 是业务能力，不是纯技术设施</tspan></text><rect x="1040" y="165" width="285" height="565" rx="22" fill="#FFFFFF" stroke="#149B72" stroke-width="2" filter="url(#shadow)"/><rect x="1040" y="165" width="285" height="70" rx="22" fill="#E8F8F2" stroke="none" stroke-width="0" /><rect x="1040" y="215" width="285" height="20" rx="0" fill="#E8F8F2" stroke="none" stroke-width="0" /><text x="1182.5" y="210" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#149B72" opacity="1" ><tspan x="1182.5" y="210">Platform</tspan></text><text x="1064" y="280" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="700" fill="#18324A" opacity="1" ><tspan x="1064" y="280">数据库 / Outbox</tspan><tspan x="1064" y="328">HTTP / MCP 运行时</tspan><tspan x="1064" y="376">LLM Gateway</tspan><tspan x="1064" y="424">缓存 / 实时通信</tspan><tspan x="1064" y="472">对象存储</tspan><tspan x="1064" y="520">沙箱 / 技术安全</tspan><tspan x="1064" y="568">可观测性 / 外部集成</tspan></text><rect x="1060" y="605" width="245" height="100" rx="14" fill="#E8F8F2" stroke="none" stroke-width="0" /><text x="1182.5" y="645" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#149B72" opacity="1" ><tspan x="1182.5" y="645">回答：能力如何连接数据库、网络和供应商</tspan><tspan x="1182.5" y="669">Platform 不拥有领域事实</tspan></text><rect x="1350" y="165" width="195" height="565" rx="22" fill="#FFFFFF" stroke="#D89A23" stroke-width="2" filter="url(#shadow)"/><rect x="1350" y="165" width="195" height="70" rx="22" fill="#FFF6DF" stroke="none" stroke-width="0" /><rect x="1350" y="215" width="195" height="20" rx="0" fill="#FFF6DF" stroke="none" stroke-width="0" /><text x="1447.5" y="210" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#D89A23" opacity="1" ><tspan x="1447.5" y="210">Bootstrap</tspan></text><text x="1374" y="280" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="700" fill="#18324A" opacity="1" ><tspan x="1374" y="280">应用入口</tspan><tspan x="1374" y="328">生命周期</tspan><tspan x="1374" y="376">依赖装配</tspan><tspan x="1374" y="424">Worker</tspan><tspan x="1374" y="472">Handler 注册</tspan></text><rect x="1370" y="605" width="155" height="100" rx="14" fill="#FFF6DF" stroke="none" stroke-width="0" /><text x="1447.5" y="645" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#D89A23" opacity="1" ><tspan x="1447.5" y="645">选择实现</tspan><tspan x="1447.5" y="669">组装并启动系统</tspan></text><rect x="125" y="770" width="1350" height="60" rx="16" fill="#0B1F33" stroke="none" stroke-width="0" /><text x="800" y="808" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="800" y="808">任务管理与能力执行属于 Foundation Context；MCP 传输和 LLM SDK 属于 Platform</tspan></text></svg>