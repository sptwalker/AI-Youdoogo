    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#149B72"/></marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#E6772E"/></marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#D95454"/></marker>
  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">控制与安全保障面：贯穿意图、计划、执行、交付和反馈</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">【目标规范】控制面由多个治理 Context 与 Platform 机制组合，不是一个万能“安全服务”</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">08</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#FFF0F0" stroke="#D95454" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#D95454" opacity="1" ><tspan x="1444" y="62">目标规范</tspan></text><rect x="55" y="175" width="165" height="72" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" /><text x="137" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="800" fill="#2F6FED" opacity="1" ><tspan x="137" y="219">主体身份</tspan></text><path d="M220 211 L243 211" fill="none" stroke="#173A5E" stroke-width="2" marker-end="url(#arrowNavy)"/><rect x="248" y="175" width="165" height="72" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" /><text x="330" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="800" fill="#7357D8" opacity="1" ><tspan x="330" y="219">角色 / 属性策略</tspan></text><path d="M413 211 L436 211" fill="none" stroke="#173A5E" stroke-width="2" marker-end="url(#arrowNavy)"/><rect x="441" y="175" width="165" height="72" rx="16" fill="#E8F6F8" stroke="#258C9B" stroke-width="1.6" /><text x="523" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="800" fill="#258C9B" opacity="1" ><tspan x="523" y="219">数据范围</tspan></text><path d="M606 211 L629 211" fill="none" stroke="#173A5E" stroke-width="2" marker-end="url(#arrowNavy)"/><rect x="634" y="175" width="165" height="72" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" /><text x="716" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="800" fill="#149B72" opacity="1" ><tspan x="716" y="219">能力编号 + 版本</tspan></text><path d="M799 211 L822 211" fill="none" stroke="#173A5E" stroke-width="2" marker-end="url(#arrowNavy)"/><rect x="827" y="175" width="165" height="72" rx="16" fill="#FFF0E5" stroke="#E6772E" stroke-width="1.6" /><text x="909" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="800" fill="#E6772E" opacity="1" ><tspan x="909" y="219">风险 / 副作用</tspan></text><path d="M992 211 L1015 211" fill="none" stroke="#173A5E" stroke-width="2" marker-end="url(#arrowNavy)"/><rect x="1020" y="175" width="165" height="72" rx="16" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" /><text x="1102" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="800" fill="#D95454" opacity="1" ><tspan x="1102" y="219">审批要求</tspan></text><path d="M1185 211 L1208 211" fill="none" stroke="#173A5E" stroke-width="2" marker-end="url(#arrowNavy)"/><rect x="1213" y="175" width="165" height="72" rx="16" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.6" /><text x="1295" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="800" fill="#D89A23" opacity="1" ><tspan x="1295" y="219">凭据范围</tspan></text><path d="M1378 211 L1401 211" fill="none" stroke="#173A5E" stroke-width="2" marker-end="url(#arrowNavy)"/><rect x="1406" y="175" width="165" height="72" rx="16" fill="#EEF2F6" stroke="#173A5E" stroke-width="1.6" /><text x="1488" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="800" fill="#173A5E" opacity="1" ><tspan x="1488" y="219">证据 / 审计</tspan></text><text x="70" y="290" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="23" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="70" y="290">六个强制控制点</tspan></text><rect x="70" y="325" width="420" height="135" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#shadow)"/><text x="280" y="362" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="280" y="362">1  意图接入</tspan></text><text x="280" y="394" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="280" y="394">认证主体与组织范围</tspan><tspan x="280" y="417">检查输入内容和风险提示</tspan></text><rect x="565" y="325" width="420" height="135" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="775" y="362" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="775" y="362">2  计划生成</tspan></text><text x="775" y="394" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="775" y="394">逐步校验可授权性</tspan><tspan x="775" y="417">真人节点、预算与能力可用性</tspan></text><rect x="1060" y="325" width="420" height="135" rx="16" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" filter="url(#shadow)"/><text x="1270" y="362" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D95454" opacity="1" ><tspan x="1270" y="362">3  能力执行</tspan></text><text x="1270" y="394" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1270" y="394">重新校验主体、能力和参数</tspan><tspan x="1270" y="417">数据范围、幂等和审批凭证</tspan></text><rect x="70" y="515" width="420" height="135" rx="16" fill="#FFF0E5" stroke="#E6772E" stroke-width="1.6" filter="url(#shadow)"/><text x="280" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#E6772E" opacity="1" ><tspan x="280" y="552">4  外部副作用</tspan></text><text x="280" y="584" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="280" y="584">使用最小范围 CredentialRef</tspan><tspan x="280" y="607">禁止模型接触明文密钥</tspan></text><rect x="565" y="515" width="420" height="135" rx="16" fill="#E8F6F8" stroke="#258C9B" stroke-width="1.6" filter="url(#shadow)"/><text x="775" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#258C9B" opacity="1" ><tspan x="775" y="552">5  结果交付</tspan></text><text x="775" y="584" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="775" y="584">事实引用与敏感数据脱敏</tspan><tspan x="775" y="607">内容安全和外发策略</tspan></text><rect x="1060" y="515" width="420" height="135" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="1270" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="1270" y="552">6  反馈升级</tspan></text><text x="1270" y="584" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1270" y="584">评估集、策略版本和审批</tspan><tspan x="1270" y="607">灰度发布、持续监测和回滚</tspan></text><rect x="155" y="720" width="1290" height="74" rx="18" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" /><text x="800" y="752" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="800" fill="#D95454" opacity="1" ><tspan x="800" y="752">高风险动作默认 fail closed；人工审核只记录决定，来源 Context 必须重新校验后才能执行生效动作</tspan></text><text x="800" y="779" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="700" fill="#18324A" opacity="1" ><tspan x="800" y="779">审批通过不等于业务动作已经成功</tspan></text></svg>