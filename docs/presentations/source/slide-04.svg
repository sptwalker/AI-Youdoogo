  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">端到端规范主链路</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">使用正式契约串起目标接入、上下文装配、规划、执行、结果交付和受控改进</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">04</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="1444" y="62">目标规范</tspan></text><rect x="92" y="155" width="1416" height="72" rx="18" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.5" /><text x="120" y="188" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#D89A23" opacity="1" ><tspan x="120" y="188">上下文与记忆层</tspan></text><text x="345" y="188" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="400" fill="#18324A" opacity="1" ><tspan x="345" y="188">全程提供带权限、来源、版本、缺失信息和过期策略的 ContextSnapshot</tspan></text><rect x="85" y="294" width="190" height="206" rx="20" fill="#FFFFFF" stroke="#2F6FED" stroke-width="2" filter="url(#shadow)"/><circle cx="180" cy="334" r="25" fill="#2F6FED" stroke="none" stroke-width="1.5" /><text x="180" y="342" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="180" y="342">1</tspan></text><text x="180" y="390" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#2F6FED" opacity="1" ><tspan x="180" y="390">目标接入</tspan></text><text x="180" y="438" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="400" fill="#65788A" opacity="1" ><tspan x="180" y="438">主体 + 目标 + 约束</tspan><tspan x="180" y="464">形成 IntentEnvelope</tspan></text><path d="M275 397 L322 397" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)"/><rect x="330" y="294" width="190" height="206" rx="20" fill="#FFFFFF" stroke="#D89A23" stroke-width="2" filter="url(#shadow)"/><circle cx="425" cy="334" r="25" fill="#D89A23" stroke="none" stroke-width="1.5" /><text x="425" y="342" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="425" y="342">2</tspan></text><text x="425" y="390" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#D89A23" opacity="1" ><tspan x="425" y="390">装配上下文</tspan></text><text x="425" y="438" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="400" fill="#65788A" opacity="1" ><tspan x="425" y="438">ContextQuery</tspan><tspan x="425" y="464">返回 ContextSnapshot</tspan></text><path d="M520 397 L567 397" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)"/><rect x="575" y="294" width="190" height="206" rx="20" fill="#FFFFFF" stroke="#7357D8" stroke-width="2" filter="url(#shadow)"/><circle cx="670" cy="334" r="25" fill="#7357D8" stroke="none" stroke-width="1.5" /><text x="670" y="342" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="670" y="342">3</tspan></text><text x="670" y="390" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#7357D8" opacity="1" ><tspan x="670" y="390">规划并启动</tspan></text><text x="670" y="438" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="400" fill="#65788A" opacity="1" ><tspan x="670" y="438">WorkIntent → WorkflowPlan</tspan><tspan x="670" y="464">检查能力 / 权限 / 真人节点</tspan><tspan x="670" y="490">通过后创建 WorkflowRun</tspan></text><path d="M765 397 L812 397" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)"/><rect x="820" y="294" width="190" height="206" rx="20" fill="#FFFFFF" stroke="#149B72" stroke-width="2" filter="url(#shadow)"/><circle cx="915" cy="334" r="25" fill="#149B72" stroke="none" stroke-width="1.5" /><text x="915" y="342" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="915" y="342">4</tspan></text><text x="915" y="390" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#149B72" opacity="1" ><tspan x="915" y="390">执行步骤</tspan></text><text x="915" y="438" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="400" fill="#65788A" opacity="1" ><tspan x="915" y="438">Agent / 真人 / Capability</tspan><tspan x="915" y="464">返回结果与证据</tspan></text><path d="M1010 397 L1057 397" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)"/><rect x="1065" y="294" width="190" height="206" rx="20" fill="#FFFFFF" stroke="#258C9B" stroke-width="2" filter="url(#shadow)"/><circle cx="1160" cy="334" r="25" fill="#258C9B" stroke="none" stroke-width="1.5" /><text x="1160" y="342" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="1160" y="342">5</tspan></text><text x="1160" y="390" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#258C9B" opacity="1" ><tspan x="1160" y="390">交付结果</tspan></text><text x="1160" y="438" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1160" y="438">ResultEnvelope</tspan><tspan x="1160" y="464">产物 + 引用 + 待确认项</tspan></text><path d="M1255 397 L1302 397" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)"/><rect x="1310" y="294" width="190" height="206" rx="20" fill="#FFFFFF" stroke="#E6772E" stroke-width="2" filter="url(#shadow)"/><circle cx="1405" cy="334" r="25" fill="#E6772E" stroke="none" stroke-width="1.5" /><text x="1405" y="342" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="1405" y="342">6</tspan></text><text x="1405" y="390" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#E6772E" opacity="1" ><tspan x="1405" y="390">形成改进候选</tspan></text><text x="1405" y="438" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1405" y="438">Outcome / Review</tspan><tspan x="1405" y="464">Evaluation → Candidate</tspan></text><rect x="130" y="575" width="1340" height="110" rx="20" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" /><text x="800" y="613" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#D95454" opacity="1" ><tspan x="800" y="613">控制与保障面横切检查</tspan></text><text x="800" y="649" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#18324A" opacity="1" ><tspan x="800" y="649">主体身份 · 访问决策 · 能力版本 · 风险/副作用 · 审批凭证 · 凭据范围 · 证据 · 审计</tspan></text><text x="800" y="721" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="19" font-weight="800" fill="#E6772E" opacity="1" ><tspan x="800" y="721">改进候选必须经过评估、必要审批和版本发布，不能直接回写生产配置</tspan></text><text x="800" y="755" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="700" fill="#E6772E" opacity="1" ><tspan x="800" y="755">每次调用携带 principal / tenant / trace / workflow / step / attempt / version 等必要关联标识</tspan></text></svg>