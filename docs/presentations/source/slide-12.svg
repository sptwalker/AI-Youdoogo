  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">业务场景三：会议管理——按当前代码约束表达</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">当前只强制会议状态、部分动作前置条件和“确认后才能转任务”；没有投票→纪要→决议的顺序状态机</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">12</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#E8F8F2" stroke="#149B72" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#149B72" opacity="1" ><tspan x="1444" y="62">当前实现</tspan></text><text x="75" y="160" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="75" y="160">会议状态机</tspan></text><rect x="230" y="145" width="210" height="86" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#shadow)"/><text x="335" y="182" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="335" y="182">scheduled</tspan></text><text x="335" y="214" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="335" y="214">已安排</tspan></text><path d="M440 188 L570 188" fill="none" stroke="#173A5E" stroke-width="2.4" marker-end="url(#arrowNavy)"/><rect x="570" y="145" width="210" height="86" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="675" y="182" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="675" y="182">in_progress</tspan></text><text x="675" y="214" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="675" y="214">进行中</tspan></text><path d="M780 188 L910 188" fill="none" stroke="#173A5E" stroke-width="2.4" marker-end="url(#arrowNavy)"/><rect x="910" y="145" width="210" height="86" rx="16" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" filter="url(#shadow)"/><text x="1015" y="182" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D95454" opacity="1" ><tspan x="1015" y="182">closed</tspan></text><text x="1015" y="214" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1015" y="214">已关闭 · 终态</tspan></text><path d="M335 231 C335 275 1015 275 1015 231" fill="none" stroke="#D95454" stroke-width="2" marker-end="url(#arrowRed)" stroke-dasharray="7 6"/><text x="675" y="266" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="700" fill="#D95454" opacity="1" ><tspan x="675" y="266">scheduled 也可直接关闭</tspan></text><rect x="70" y="330" width="440" height="285" rx="22" fill="#FFFFFF" stroke="#7357D8" stroke-width="2" filter="url(#shadow)"/><text x="290" y="374" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="25" font-weight="800" fill="#7357D8" opacity="1" ><tspan x="290" y="374">必须处于进行中</tspan></text><text x="290" y="424" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="19" font-weight="700" fill="#18324A" opacity="1" ><tspan x="290" y="424">真人发言 / AI 专家发言</tspan><tspan x="290" y="474">真人投票 / AI 参考投票</tspan><tspan x="290" y="524">否则动作被拒绝</tspan></text><rect x="550" y="330" width="440" height="285" rx="22" fill="#FFFFFF" stroke="#D89A23" stroke-width="2" filter="url(#shadow)"/><text x="770" y="374" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="25" font-weight="800" fill="#D89A23" opacity="1" ><tspan x="770" y="374">其他动作的真实前置条件</tspan></text><text x="770" y="420" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#18324A" opacity="1" ><tspan x="770" y="420">AI 生成纪要：至少已有一条发言</tspan><tspan x="770" y="472">创建决议草案：只校验会议存在</tspan><tspan x="770" y="524">投票统计：真人票和 AI 票分开</tspan></text><rect x="1030" y="330" width="500" height="285" rx="22" fill="#FFFFFF" stroke="#149B72" stroke-width="2" filter="url(#shadow)"/><text x="1280" y="374" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="25" font-weight="800" fill="#149B72" opacity="1" ><tspan x="1280" y="374">决议转任务</tspan></text><rect x="1060" y="430" width="150" height="92" rx="16" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.6" filter="url(#shadow)"/><text x="1135" y="467" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D89A23" opacity="1" ><tspan x="1135" y="467">决议草案</tspan></text><text x="1135" y="499" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1135" y="499">未确认</tspan></text><path d="M1210 476 L1240 476" fill="none" stroke="#173A5E" stroke-width="2.2" marker-end="url(#arrowNavy)"/><rect x="1240" y="430" width="150" height="92" rx="16" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" filter="url(#shadow)"/><text x="1315" y="467" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D95454" opacity="1" ><tspan x="1315" y="467">真人确认</tspan></text><text x="1315" y="499" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1315" y="499">写 confirmed_by</tspan></text><path d="M1390 476 L1420 476" fill="none" stroke="#173A5E" stroke-width="2.2" marker-end="url(#arrowNavy)"/><rect x="1420" y="430" width="90" height="92" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="1465" y="467" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="1465" y="467">转任务</tspan></text><text x="1465" y="499" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1465" y="499">仅一次</tspan></text><text x="1280" y="570" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="800" fill="#149B72" opacity="1" ><tspan x="1280" y="570">只有 is_confirmed=true 且尚未转换的决议可以创建 TaskCard</tspan></text><rect x="90" y="685" width="1420" height="84" rx="18" fill="#0B1F33" stroke="none" stroke-width="0" /><text x="800" y="718" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#A9E8D5" opacity="1" ><tspan x="800" y="718">当前没有强制“投票 → 纪要 → 决议”的固定顺序</tspan></text><text x="800" y="749" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="800" y="749">human_passed 只是统计值，不会自动确认决议；确认动作也不依赖投票是否通过</tspan></text></svg>