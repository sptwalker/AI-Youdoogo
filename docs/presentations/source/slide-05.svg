  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">中枢编排层：逻辑角色不等于 DDD Context</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">【目标规范】运行角色描述“做什么”；Context 定义“谁拥有规则、状态和写入权”</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">05</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="1444" y="62">目标规范</tspan></text><text x="75" y="166" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="75" y="166">运行角色：逻辑职责</tspan></text><rect x="70" y="205" width="285" height="112" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="212.5" y="242" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="212.5" y="242">监督者（Supervisor）</tspan></text><text x="212.5" y="274" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="212.5" y="274">保持目标、约束</tspan><tspan x="212.5" y="297">和全局完成条件</tspan></text><rect x="395" y="205" width="285" height="112" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#shadow)"/><text x="537.5" y="242" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="537.5" y="242">任务拆解 / 规划</tspan></text><text x="537.5" y="274" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="537.5" y="274">把意图转为可验证的</tspan><tspan x="537.5" y="297">WorkflowPlan</tspan></text><rect x="70" y="355" width="285" height="112" rx="16" fill="#E8F6F8" stroke="#258C9B" stroke-width="1.6" filter="url(#shadow)"/><text x="212.5" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#258C9B" opacity="1" ><tspan x="212.5" y="392">路由 / 分派</tspan></text><text x="212.5" y="424" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="212.5" y="424">按能力、范围、风险、成本</tspan><tspan x="212.5" y="447">和可用性选择执行者</tspan></text><rect x="395" y="355" width="285" height="112" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="537.5" y="392" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="537.5" y="392">结果汇总</tspan></text><text x="537.5" y="424" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="537.5" y="424">按步骤证据整理结果</tspan><tspan x="537.5" y="447">不能补造缺失事实</tspan></text><path d="M705 260 C760 260 760 260 820 260" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)" stroke-dasharray="7 6"/><path d="M705 410 C760 410 760 410 820 410" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)" stroke-dasharray="7 6"/><text x="765" y="230" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="700" fill="#65788A" opacity="1" ><tspan x="765" y="230">由多个 Context</tspan></text><text x="765" y="252" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="700" fill="#65788A" opacity="1" ><tspan x="765" y="252">共同承载</tspan></text><text x="835" y="166" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="835" y="166">DDD Context：状态与所有权</tspan></text><rect x="820" y="205" width="320" height="128" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#shadow)"/><text x="980" y="242" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="980" y="242">工作规划</tspan></text><text x="980" y="274" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="980" y="274">拥有 WorkIntent、WorkflowPlan</tspan><tspan x="980" y="297">规划策略与计划校验</tspan></text><rect x="1175" y="205" width="320" height="128" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="1335" y="242" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="1335" y="242">工作流运行</tspan></text><text x="1335" y="274" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1335" y="274">拥有 WorkflowRun / Step</tspan><tspan x="1335" y="297">DAG、租约、重试、恢复、真人停点</tspan></text><rect x="820" y="380" width="320" height="128" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="980" y="417" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="980" y="417">任务管理</tspan></text><text x="980" y="449" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="980" y="449">拥有 TaskCard</tspan><tspan x="980" y="472">分配、汇报、验收与驳回</tspan></text><rect x="1175" y="380" width="320" height="128" rx="16" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" filter="url(#shadow)"/><text x="1335" y="417" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D95454" opacity="1" ><tspan x="1335" y="417">来源业务 Context</tspan></text><text x="1335" y="449" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1335" y="449">拥有业务规则和原始事实</tspan><tspan x="1335" y="472">作出最终业务生效决定</tspan></text><rect x="100" y="585" width="1400" height="96" rx="20" fill="#0B1F33" stroke="none" stroke-width="0" /><text x="800" y="621" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#AFC8E1" opacity="1" ><tspan x="800" y="621">规范协作链</tspan></text><text x="800" y="655" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="800" y="655">IntentEnvelope + ContextSnapshot → 工作规划 → 工作流运行 → 智能体 / 企业能力 / 真人任务</tspan></text><rect x="175" y="720" width="1250" height="70" rx="17" fill="#FFF0F0" stroke="#D95454" stroke-width="1.5" /><text x="800" y="751" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="800" fill="#D95454" opacity="1" ><tspan x="800" y="751">边界：编排层不直接读取其他 Context 的 ORM，不直连供应商 SDK，也不绕过权限、幂等和审批</tspan></text></svg>