  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">业务场景一：运营分析——当前能力与目标接续分开表达</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">当前代码可产出日报、告警和建议文本；正式提案或任务仍需由业务用例创建</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">10</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#E8F6F8" stroke="#258C9B" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#258C9B" opacity="1" ><tspan x="1444" y="62">当前 + 目标</tspan></text><rect x="78" y="154" width="230" height="38" rx="19" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.2" /><text x="193" y="180" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="193" y="180">当前已实现</tspan></text><rect x="70" y="250" width="210" height="125" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#