增环比下降</tspan><tspan x="685" y="342">次留低于阈值</tspan></text><path d="M790 312 L827 312" fill="none" stroke="#173A5E" stroke-width="2.4" marker-end="url(#arrowNavy)"/><rect x="835" y="250" width="210" height="125" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="940" y="287" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="940" y="287">AI 生成</tspan></text><text x="940" y="319" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="940" y="319">运营日报</tspan><tspan x="940" y="342">异常告警播报</tspan></text><path d="M1045 312 L1082 312" fill="none" stroke="#173A5E" stroke-width="2.4" marker-end="url(#arrowNavy)"/><rect x="1090" y="250" width="210" height="125" rx="16" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.6" filter="url(#shadow)"/><text x="1195" y="287" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D89A23" opacity="1" ><tspan x="1195" y="287">优化建议</tspan></text><text x="1195" y="319" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1195" y="319">结构化建议文本</tspan><tspan x="1195" y="342">仅 AgentTaskRecord 留痕</tspan></text><rect x="1325" y="235" width="220" height="155" rx="18" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" /><text x="1435" y="273" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="800" fill="#D95454" opacity="1" ><tspan x="1435" y="273">当前边界</tspan></text><text x="1435" y="311" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#18324A" opacity="1" ><tspan x="1435" y="311">不会写 ProposalCard</tspan><tspan x="1435" y="337">不会写 TaskCard</tspan><tspan x="1435" y="363">也不会自动启动执行</tspan></text><rect x="78" y="455" width="230" height="38" rx="19" fill="#FFF0E5" stroke="#E6772E" stroke-width="1.2" /><text x="193" y="481" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#E6772E" opacity="1" ><tspan x="193" y="481">目标接续（待用例打通）</tspan></text><rect x="170" y="555" width="250" height="120" rx="16" fill="#FFF0E5" stroke="#E6772E" stroke-width="1.6" filter="url(#shadow)"/><text x="295" y="592" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#E6772E" opacity="1" ><tspan x="295" y="592">管理者判断</tspan></text><text x="295" y="624" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="295" y="624">只需观察：归档并监测</tspan><tspan x="295" y="647">需要行动：提交业务命令</tspan></text><path d="M420 615 L517 615" fill="none" stroke="#E6772E" stroke-width="2.4" marker-end="url(#arrowOrange)" stroke-dasharray="8 6"/><rect x="525" y="555" width="250" height="120" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#shadow)"/><text x="650" y="592" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="650" y="592">正式业务用例</tspan></text><text x="650" y="624" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="650" y="624">创建提案</tspan><tspan x="650" y="647">或创建任务卡</tspan></text><path d="M775 615 L872 615" fill="none" stroke="#E6772E" stroke-width="2.4" marker-end="url(#arrowOrange)" stroke-dasharray="8 6"/><rect x="880" y="555" width="250" height="120" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="1005" y="592" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="1005" y="592">任务执行与验收</tspan></text><text x="1005" y="624" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1005" y="624">任务 / 工作流</tspan><tspan x="1005" y="647">产物、证据与真人验收</tspan></text><path d="M1130 615 L1227 615" fill="none" stroke="#E6772E" stroke-width="2.4" marker-end="url(#arrowOrange)" stroke-dasharray="8 6"/><rect x="1235" y="555" width="250" height="120" rx="16" fill="#E8F6F8" stroke="#258C9B" stroke-width="1.6" filter="url(#shadow)"/><text x="1360" y="592" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#258C9B" opacity="1" ><tspan x="1360" y="592">运营结果写回</tspan></text><text x="1360" y="624" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1360" y="624">指标 / 结果事件</tspan><tspan x="1360" y="647">由运营分析拥有</tspan></text><path d="M1360 675 C1110 800 350 795 295 680" fill="none" stroke="#E6772E" stroke-width="2.7" marker-end="url(#arrowOrange)" stroke-dasharray="9 7"/><text x="800" y="763" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="800" fill="#E6772E" opacity="1" ><tspan x="800" y="763">目标接续尚未在当前代码中自动打通：AI 报告不能直接改变提案、任务或其他业务状态</tspan></text></svg>