0" fill="#258C9B" opacity="1" ><tspan x="1365" y="457">交付 / 协作能力</tspan></text><text x="1365" y="489" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1365" y="489">交付物管理与协作请求</tspan></text><rect x="1190" y="550" width="350" height="92" rx="16" fill="#E8F6F8" stroke="#258C9B" stroke-width="1.6" filter="url(#shadow)"/><text x="1365" y="587" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#258C9B" opacity="1" ><tspan x="1365" y="587">技术适配</tspan></text><text x="1365" y="619" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1365" y="619">HTTP / MCP / Sandbox 只实现端口</tspan></text><path d="M1140 340 L1190 206" fill="none" stroke="#258C9B" stroke-width="2" marker-end="url(#arrowNavy)"/><path d="M1140 340 L1190 336" fill="none" stroke="#258C9B" stroke-width="2" marker-end="url(#arrowNavy)"/><path d="M1140 340 L1190 466" fill="none" stroke="#258C9B" stroke-width="2" marker-end="url(#arrowNavy)"/><path d="M1365 382 L1365 550" fill="none" stroke="#258C9B" stroke-width="2.2" marker-end="url(#arrowNavy)"/><path d="M625 445 L625 680" fill="none" stroke="#149B72" stroke-width="2.2" marker-end="url(#arrowGreen)"/><path d="M980 490 L980 680" fill="none" stroke="#D95454" stroke-width="2.2" marker-end="url(#arrowRed)"/><rect x="235" y="680" width="1130" height="108" rx="20" fill="#0B1F33" stroke="none" stroke-width="0" /><text x="800" y="719" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#AFC8E1" opacity="1" ><tspan x="800" y="719">步骤回执返回工作流运行</tspan></text><text x="800" y="751" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="800" y="751">智能体执行结果 / 任务验收或驳回事件 / CapabilityResult + Evidence</tspan></text><text x="800" y="778" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#BDD0E2" opacity="1" ><tspan x="800" y="778">发现了 Tool 或 MCP 能力，不等于主体已经获得执行授权</tspan></text></svg>