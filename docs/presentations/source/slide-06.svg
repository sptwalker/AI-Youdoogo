  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">业务执行与技能层：三类执行路径不能混为一条</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">【目标规范】真人任务由任务管理承载；只有智能体行动或直接能力步骤进入能力执行门禁</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">06</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#E8F8F2" stroke="#149B72" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#149B72" opacity="1" ><tspan x="1444" y="62">目标规范</tspan></text><rect x="55" y="330" width="175" height="118" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="142.5" y="367" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="142.5" y="367">WorkflowStep</tspan></text><text x="142.5" y="399" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="142.5" y="399">步骤输入、trace</tspan><tspan x="142.5" y="422">执行者和验收要求</tspan></text><path d="M230 389 L285 389" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)"/><polygon points="370,333 455,389 370,445 285,389" fill="#EEF2F6" stroke="#173A5E" stroke-width="2" filter="url(#shadow)"/><text x="370" y="396" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#173A5E" opacity="1" ><tspan x="370" y="396">分派给谁？</tspan></text><rect x="490" y="180" width="270" height="105" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#shadow)"/><text x="625" y="217" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="625" y="217">智能体执行</tspan></text><text x="625" y="249" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="625" y="249">使用 ExpertSnapshot</tspan><tspan x="625" y="272">需要行动时调用能力门禁</tspan></text><rect x="490" y="340" width="270" height="105" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="625" y="377" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="625" y="377">真人任务</tspan></text><text x="625" y="409" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="625" y="409">任务管理负责分配、汇报</tspan><tspan x="625" y="432">真人验收或驳回</tspan></text><rect x="490" y="500" width="270" height="105" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="625" y="537" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="625" y="537">直接能力步骤</tspan></text><text x="625" y="569" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="625" y="569">工作流运行直接发起</tspan><tspan x="625" y="592">CapabilityInvocation</tspan></text><path d="M455 389 L470 389 L470 232 L490 232" fill="none" stroke="#2F6FED" stroke-width="2" marker-end="url(#arrowBlue)"/><path d="M455 389 L490 392" fill="none" stroke="#149B72" stroke-width="2" marker-end="url(#arrowGreen)"/><path d="M455 389 L470 389 L470 552 L490 552" fill="none" stroke="#7357D8" stroke-width="2" marker-end="url(#arrowNavy)"/><rect x="820" y="190" width="320" height="300" rx="22" fill="#FFF0F0" stroke="#D95454" stroke-width="2" filter="url(#shadow)"/><text x="980" y="234" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="27" font-weight="800" fill="#D95454" opacity="1" ><tspan x="980" y="234">能力执行门禁</tspan></text><text x="980" y="279" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="600" fill="#18324A" opacity="1" ><tspan x="980" y="279">读取 CapabilityDefinition</tspan><tspan x="980" y="313">校验主体、Expert、参数和数据范围</tspan><tspan x="980" y="347">核验风险、审批凭证与能力版本</tspan><tspan x="980" y="381">记录 ToolExecution 幂等与重放</tspan><tspan x="980" y="415">归一结果、回执和审计引用</tspan></text><path d="M760 232 C790 232 790 280 820 280" fill="none" stroke="#2F6FED" stroke-width="2.2" marker-end="url(#arrowBlue)"/><path d="M760 552 C790 552 790 410 820 410" fill="none" stroke="#7357D