  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">上下文与记忆系统（Context System / Memory）：统一受治理入口</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">“唯一共同知识源”指统一查询、权限、语义、引用和上下文组装，不表示共享写库或集中拥有全部事实</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">07</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#D89A23" opacity="1" ><tspan x="1444" y="62">目标规范</tspan></text><text x="85" y="166" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="85" y="166">来源 Context 与企业系统：各自拥有原始事实和写入规则</tspan></text><rect x="85" y="205" width="300" height="90" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#shadow)"/><text x="235" y="242" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="235" y="242">提案管理</tspan></text><text x="235" y="274" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="235" y="274">提案、评审、状态</tspan></text><rect x="85" y="320" width="300" height="90" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="235" y="357" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="235" y="357">会议管理</tspan></text><text x="235" y="389" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="235" y="389">会议、投票、决议</tspan></text><rect x="85" y="435" width="300" height="90" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="235" y="472" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="235" y="472">工作流运行 / 任务管理</tspan></text><text x="235" y="504" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="235" y="504">运行状态、任务与验收</tspan></text><rect x="85" y="550" width="300" height="90" rx="16" fill="#E8F6F8" stroke="#258C9B" stroke-width="1.6" filter="url(#shadow)"/><text x="235" y="587" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#258C9B" opacity="1" ><tspan x="235" y="587">助理会话 / 运营分析</tspan></text><text x="235" y="619" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="235" y="619">对话归档、指标与异常</tspan></text><rect x="475" y="180" width="650" height="500" rx="26" fill="#FFFFFF" stroke="#D89A23" stroke-width="2" filter="url(#shadow)"/><text x="800" y="225" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="27" font-weight="800" fill="#D89A23" opacity="1" ><tspan x="800" y="225">环境投影（Environment Projection）</tspan></text><text x="800" y="255" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="400" fill="#65788A" opacity="1" ><tspan x="800" y="255">围绕一次任务构造 ContextSnapshot</tspan></text><rect x="535" y="310" width="180" height="145" rx="16" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.6" filter="url(#shadow)"/><text x="625" y="347" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D89A23" opacity="1" ><tspan x="625" y="347">ContextQuery</tspan></text><text x="625" y="379" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="625" y="379">主体 · 用途 · 引用</tspan><tspan x="625" y="402">时间范围 · Token 预算</tspan></text><path d="M715 382 L755 382" fill="none" stroke="#D89A23" stroke-width="2.2" marker-end="url(#arrowOrange)"/><rect x="755" y="310" width="180" height="145" rx="16" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.6" filter="url(#shadow)"/><text x="845" y="347" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D89A