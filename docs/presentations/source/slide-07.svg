url(#arrowNavy)" stroke-dasharray="6 5"/><path d="M385 480 L475 390" fill="none" stroke="#149B72" stroke-width="1.8" marker-end="url(#arrowNavy)" stroke-dasharray="6 5"/><path d="M385 595 L475 390" fill="none" stroke="#258C9B" stroke-width="1.8" marker-end="url(#arrowNavy)" stroke-dasharray="6 5"/><text x="1210" y="166" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="1210" y="166">参与快照装配的协作 Context</tspan></text><rect x="1190" y="205" width="335" height="420" rx="18" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.5" filter="url(#shadow)"/><circle cx="1224" cy="239" r="20" fill="#D89A23" stroke="none" stroke-width="1.5" /><text x="1224" y="246" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="1224" y="246">知</tspan></text><text x="1254" y="242" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="700" fill="#18324A" opacity="1" ><tspan x="1254" y="242">协作能力</tspan></text><text x="1214" y="277" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1214" y="277">组织结构 / 专家管理</tspan><tspan x="1214" y="322">Wiki / 知识检索</tspan><tspan x="1214" y="367">语义目录 / 组织记忆</tspan><tspan x="1214" y="412">受治理数据查询</tspan><tspan x="1214" y="457">访问控制</tspan></text><path d="M1190 410 L1125 410" fill="none" stroke="#D89A23" stroke-width="2.2" marker-end="url(#arrowOrange)"/><rect x="185" y="730" width="1230" height="64" rx="16" fill="#FFF0F0" stroke="#D95454" stroke-width="1.5" /><text x="800" y="770" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#D95454" opacity="1" ><tspan x="800" y="770">红线：模型生成的推断、摘要和建议必须标注类型与置信度，不能自动升级为企业事实</tspan></text></svg>