  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">业务场景二：提案管理——按当前代码状态机表达</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">AI 预研内部可执行反思和修订，但它不是一个独立业务状态；通过或驳回只能由真人写入</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">11</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="1444" y="62">当前实现</tspan></text><rect x="78" y="154" width="230" height="38" rx="19" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.2" /><text x="193" y="180" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="193" y="180">提案状态机（当前）</tspan></text><rect x="60" y="285" width="185" height="125" rx="16" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.6" filter="url(#shadow)"/><text x="152.5" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="152.5" y="322">draft 草稿</tspan></text><text x="152.5" y="354" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="152.5" y="354">创建提案后</tspan><tspan x="152.5" y="377">初始状态</tspan></text><path d="M245 347 L277 347" fill="none" stroke="#173A5E" stroke-width="2.2" marker-end="url(#arrowNavy)"/><rect x="285" y="285" width="185" height="125" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="377.5" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="377.5" y="322">发起 AI 预研</tspan></text><text x="377.5" y="354" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="377.5" y="354">除 approved / rejected 外</tspan><tspan x="377.5" y="377">当前均可发起</tspan></text><path d="M470 347 L502 347" fill="none" stroke="#173A5E" stroke-width="2.2" marker-end="url(#arrowNavy)"/><rect x="510" y="285" width="185" height="125" rx="16" fill="#E8F6F8" stroke="#258C9B" stroke-width="1.6" filter="url(#shadow)"/><text x="602.5" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#258C9B" opacity="1" ><tspan x="602.5" y="322">researching</tspan></text><text x="602.5" y="354" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="602.5" y="354">先写入“预研中”</tspan><tspan x="602.5" y="377">再调用模型</tspan></text><path d="M695 347 L727 347" fill="none" stroke="#173A5E" stroke-width="2.2" marker-end="url(#arrowNavy)"/><rect x="735" y="285" width="185" height="125" rx="16" fill="#F0ECFF" stroke="#7357D8" stroke-width="1.6" filter="url(#shadow)"/><text x="827.5" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#7357D8" opacity="1" ><tspan x="827.5" y="322">预研结果</tspan></text><text x="827.5" y="354" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="827.5" y="354">保存 AI 评审记录</tspan><tspan x="827.5" y="377">内部反思，必要时修订</tspan></text><path d="M920 347 L952 347" fill="none" stroke="#173A5E" stroke-width="2.2" marker-end="url(#arrowNavy)"/><rect x="960" y="285" width="185" height="125" rx="16" fill="#FFF6DF" stroke="#D89A23" stroke-width="1.6" filter="url(#shadow)"/><text x="1052.5" y="322" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D89A23" opacity="1" ><tspan x="1052.5" y="322">reviewed</tspan></text><text x="1052.5" y="354" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1052.5" y="354">预研完成</tspan><tspan x="1052.5" y="377">等待真人评审</tspan></text><path d="M1145 347 L1190 347" fill="none" stroke="#173A5E" stroke-width="2.4" marker-end="url(#arrowNavy)"/><polygon points="1300,279.5 1410,347 1300,414.5 1190,347" fill="#FFF0F0" stroke="#D95454" stroke-width="2" filter="url(#shadow)"/><text x="1300" y="340" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#D95454" opacity="1" ><tspan x="1300" y="340">真人评审</tspan></text><text x="1300" y="368" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1300" y="368">approve / reject</tspan></text><path d="M1300 415 L1300 495 L1045 495" fill="none" stroke="#D95454" stroke-width="2.5" marker-end="url(#arrowRed)"/><rect x="805" y="460" width="240" height="110" rx="16" fill="#FFF0F0" stroke="#D95454" stroke-width="1.6" filter="url(#shadow)"/><text x="925" y="497" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#D95454" opacity="1" ><tspan x="925" y="497">rejected 已驳回</tspan></text><text x="925" y="529" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="925" y="529">当前禁止再次 AI 预研</tspan><tspan x="925" y="552">继续需新建提案</tspan></text><path d="M1410 347 L1460 347 L1460 470" fill="none" stroke="#149B72" stroke-width="2.5" marker-end="url(#arrowGreen)"/><rect x="1335" y="470" width="220" height="105" rx="16" fill="#E8F8F2" stroke="#149B72" stroke-width="1.6" filter="url(#shadow)"/><text x="1445" y="507" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#149B72" opacity="1" ><tspan x="1445" y="507">approved 已通过</tspan></text><text x="1445" y="539" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1445" y="539">只有该状态</tspan><tspan x="1445" y="562">可以转换任务卡</tspan></text><path d="M1445 575 L1445 645" fill="none" stroke="#173A5E" stroke-width="2.5" marker-end="url(#arrowNavy)"/><rect x="1320" y="645" width="250" height="95" rx="16" fill="#EEF2F6" stroke="#173A5E" stroke-width="1.6" filter="url(#shadow)"/><text x="1445" y="682" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="21" font-weight="700" fill="#173A5E" opacity="1" ><tspan x="1445" y="682">创建 TaskCard（仅一次）</tspan></text><text x="1445" y="714" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="400" fill="#65788A" opacity="1" ><tspan x="1445" y="714">重复转换会被拒绝</tspan></text><rect x="85" y="650" width="1080" height="90" rx="18" fill="#0B1F33" stroke="none" stroke-width="0" /><text x="625" y="686" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="20" font-weight="800" fill="#FFB7B7" opacity="1" ><tspan x="625" y="686">当前硬规则</tspan></text><text x="625" y="718" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="625" y="718">真人评审只接受 reviewed；AI 无权写 approved / rejected；终态提案不能再次预研</tspan></text></svg>