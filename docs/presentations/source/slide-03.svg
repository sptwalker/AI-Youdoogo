  </defs><rect width="1600" height="900" fill="#F5F7FA"/><rect x="0" y="0" width="18" height="900" fill="#2F6FED"/><text x="72" y="58" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="34" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="72" y="58">目标运行架构：四层主链路 + 两个横切系统</tspan></text><text x="72" y="91" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="72" y="91">这是运行责任视图，不等于四个目录、四个服务、四个进程或四个数据库</tspan></text><path d="M72 116 L1528 116" fill="none" stroke="#C9D4DF" stroke-width="1.3"/><text x="72" y="872" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="400" fill="#8797A6" opacity="1" ><tspan x="72" y="872">企业智能体平台架构与业务闭环</tspan></text><text x="1528" y="872" text-anchor="end" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="14" font-weight="700" fill="#8797A6" opacity="1" ><tspan x="1528" y="872">03</tspan></text><rect x="1360" y="36" width="168" height="38" rx="19" fill="#EAF2FF" stroke="#2F6FED" stroke-width="1.2" /><text x="1444" y="62" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="700" fill="#2F6FED" opacity="1" ><tspan x="1444" y="62">目标规范</tspan></text><rect x="92" y="170" width="170" height="555" rx="26" fill="#FFF0E5" stroke="#E6772E" stroke-width="2" /><text x="177" y="225" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="23" font-weight="800" fill="#E6772E" opacity="1" ><tspan x="177" y="225">反馈闭环</tspan><tspan x="177" y="256">业务结果与改进</tspan></text><text x="177" y="315" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="600" fill="#18324A" opacity="1" ><tspan x="177" y="315">业务结果</tspan><tspan x="177" y="363">验收意见</tspan><tspan x="177" y="411">失败原因</tspan><tspan x="177" y="459">异常告警</tspan><tspan x="177" y="507">人工评分</tspan></text><path d="M177 650 C177 785 510 790 510 705" fill="none" stroke="#E6772E" stroke-width="3" marker-end="url(#arrowOrange)" stroke-dasharray="8 7"/><rect x="1338" y="170" width="170" height="555" rx="26" fill="#FFF0F0" stroke="#D95454" stroke-width="2" /><text x="1423" y="225" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="22" font-weight="800" fill="#D95454" opacity="1" ><tspan x="1423" y="225">控制与保障面</tspan><tspan x="1423" y="256">全程强制护栏</tspan></text><text x="1423" y="315" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="18" font-weight="600" fill="#18324A" opacity="1" ><tspan x="1423" y="315">身份</tspan><tspan x="1423" y="357">权限</tspan><tspan x="1423" y="399">数据范围</tspan><tspan x="1423" y="441">能力与风险</tspan><tspan x="1423" y="483">审批</tspan><tspan x="1423" y="525">凭据与审计</tspan></text><text x="1423" y="620" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="16" font-weight="700" fill="#D95454" opacity="1" ><tspan x="1423" y="620">横切所有调用</tspan><tspan x="1423" y="647">高风险默认拒绝</tspan></text><rect x="315" y="176" width="970" height="106" rx="22" fill="#EAF2FF" stroke="#2F6FED" stroke-width="2" filter="url(#shadow)"/><circle cx="370" cy="229" r="30" fill="#2F6FED" stroke="none" stroke-width="1.5" /><text x="370" y="238" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="370" y="238">1</tspan></text><text x="419" y="219" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="419" y="219">意图与结果层</tspan></text><text x="419" y="252" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="419" y="252">接收主体、业务目标、预期结果、约束与引用；交付结果、证据和待确认事项</tspan></text><path d="M800 282 L800 306" fill="none" stroke="#173A5E" stroke-width="2.4" marker-end="url(#arrowNavy)"/><rect x="315" y="306" width="970" height="106" rx="22" fill="#F0ECFF" stroke="#7357D8" stroke-width="2" filter="url(#shadow)"/><circle cx="370" cy="359" r="30" fill="#7357D8" stroke="none" stroke-width="1.5" /><text x="370" y="368" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="370" y="368">2</tspan></text><text x="419" y="349" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="419" y="349">中枢编排层</tspan></text><text x="419" y="382" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="419" y="382">基于受控上下文完成规划、分派、运行协调、恢复和结果汇总</tspan></text><path d="M800 412 L800 436" fill="none" stroke="#173A5E" stroke-width="2.4" marker-end="url(#arrowNavy)"/><rect x="315" y="436" width="970" height="106" rx="22" fill="#E8F8F2" stroke="#149B72" stroke-width="2" filter="url(#shadow)"/><circle cx="370" cy="489" r="30" fill="#149B72" stroke="none" stroke-width="1.5" /><text x="370" y="498" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="370" y="498">3</tspan></text><text x="419" y="479" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="419" y="479">业务执行与技能层</tspan></text><text x="419" y="512" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="419" y="512">智能体、真人或企业能力执行步骤；所有副作用通过受治理能力契约</tspan></text><rect x="315" y="566" width="970" height="106" rx="22" fill="#FFF6DF" stroke="#D89A23" stroke-width="2" filter="url(#shadow)"/><circle cx="370" cy="619" r="30" fill="#D89A23" stroke="none" stroke-width="1.5" /><text x="370" y="628" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" opacity="1" ><tspan x="370" y="628">4</tspan></text><text x="419" y="609" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="800" fill="#0B1F33" opacity="1" ><tspan x="419" y="609">上下文与记忆层</tspan></text><text x="419" y="642" text-anchor="start" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="17" font-weight="400" fill="#65788A" opacity="1" ><tspan x="419" y="642">统一的受治理查询与上下文装配入口；来源 Context 仍拥有原始事实</tspan></text><path d="M1040 566 C1190 530 1190 260 1040 282" fill="none" stroke="#D89A23" stroke-width="2.2" marker-end="url(#arrowOrange)" stroke-dasharray="7 6"/><text x="1163" y="413" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="15" font-weight="700" fill="#D89A23" opacity="1" ><tspan x="1163" y="413">按权限和用途</tspan><tspan x="1163" y="435">提供上下文快照</tspan></text><rect x="315" y="720" width="970" height="54" rx="16" fill="#0B1F33" stroke="none" stroke-width="0" /><text x="800" y="755" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" opacity="1" ><tspan x="800" y="755">控制面在关键节点强制检查；反馈闭环消费结果与证据——它们不是六个串行服务</tspan></text></svg>