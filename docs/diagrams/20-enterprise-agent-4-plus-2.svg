  <circle cx="1368" cy="810" r="9" fill="#ffffff" stroke="#cf4545" stroke-width="3"/>
  <text x="1390" y="803" class="rail-label">上下文供给</text>
  <text x="1390" y="823" class="rail-text">先做范围过滤 · 保留来源</text>
