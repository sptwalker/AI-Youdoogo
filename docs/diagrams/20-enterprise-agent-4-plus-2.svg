  <path d="M1122 994 L1122 875" class="feedback-edge"/>
  <text x="1135" y="922" class="edge-label" fill="#b95a1b">经批准的知识 / SOP 版本</text>
  <path d="M1265 1013 L1290 1013 L1290 400 L1230 400" class="feedback-edge"/>
  <text x="1281" y="719" text-anchor="middle" class="edge-label" fill="#b95a1b" transform="rotate(-90 1281 719)">经批准的策略 / 路由 / 能力版本</text>

  <!-- Control and assurance plane -->
  <rect x="1330" y="95" width="220" height="955" rx="24" fill="#fff0f0" stroke="#cf4545" stroke-width="2.4"/>
  <text x="1440" y="132" text-anchor="middle" class="rail-title">控制与安全保障面</text>
  <text x="1440" y="153" text-anchor="middle" class="rail-text">贯穿全链路的独立合规护栏</text>
  <text x="1440" y="177" text-anchor="middle" class="rail-label">CEAD · 每一步都检查</text>

  <line x1="1368" y1="210" x2="1368" y2="995" stroke="#cf4545" stroke-width="3"/>

  <circle cx="1368" cy="235" r="9" fill="#ffffff" stroke="#cf4545" stroke-width="3"/>
  <text x="1390" y="228" class="rail-label">意图与结果</text>
