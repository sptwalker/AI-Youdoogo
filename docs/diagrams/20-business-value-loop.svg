  <text x="1570" y="301" text-anchor="middle" class="box-title">任务卡与工作流</text>
  <text x="1570" y="323" text-anchor="middle" class="box-text">拆解 · 分派 · 进度 · 暂停/恢复</text>
  <text x="1570" y="391" text-anchor="middle" class="box-title">智能体或真人执行</text>
  <text x="1570" y="413" text-anchor="middle" class="box-text">专业分析、协作或人工处理</text>
  <text x="1570" y="481" text-anchor="middle" class="box-title">调用企业能力与业务系统</text>
  <text x="1570" y="503" text-anchor="middle" class="box-text">数据查询 · 连接器 · API/MCP · 沙箱</text>
  <text x="1570" y="571" text-anchor="middle" class="box-title">形成可验证的业务产物</text>
  <text x="1570" y="593" text-anchor="middle" class="box-text">文件交付 · 协作请求 · 业务状态变更</text>
  <text x="1570" y="661" text-anchor="middle" class="box-title">真人验收与真实业务结果</text>
  <text x="1570" y="684" text-anchor="middle" class="box-text">完成率 · 响应时效 · 活跃/留存</text>
  <text x="1570" y="705" text-anchor="middle" class="box-text">转化 · 成本 · 质量 · 用户修正</text>
