  <text x="327" y="711" text-anchor="middle" class="box-text">状态进入进行中</text>

  <rect x="420" y="645" width="145" height="93" rx="12" fill="#ffffff" stroke="#91cfbc"/>
  <text x="492" y="670" text-anchor="middle" class="box-title">真人与 AI 会商</text>
  <text x="492" y="692" text-anchor="middle" class="box-text">观点 · 分歧 · 追问</text>
  <text x="492" y="711" text-anchor="middle" class="box-text">AI 发言只供参考</text>

  <rect x="585" y="645" width="145" height="93" rx="12" fill="#ffffff" stroke="#91cfbc"/>
  <text x="657" y="670" text-anchor="middle" class="box-title">真人 / AI 投票</text>
