  <text x="657" y="711" text-anchor="middle" class="box-text">以真人票为准</text>

  <rect x="750" y="645" width="145" height="93" rx="12" fill="#ffffff" stroke="#91cfbc"/>
  <text x="822" y="670" text-anchor="middle" class="box-title">AI 生成纪要</text>
  <text x="822" y="692" text-anchor="middle" class="box-text">主要观点 · 分歧点</text>
  <text x="822" y="711" text-anchor="middle" class="box-text">建议决议</text>

  <rect x="915" y="645" width="145" height="93" rx="12" fill="#ffffff" stroke="#91cfbc"/>
  <text x="987" y="670" text-anchor="middle" class="box-title">形成决议草案</text>
  <text x="987" y="692" text-anchor="middle" class="box-text">行动内容 · 负责人</text>
  <text x="987" y="711" text-anchor="middle" class="box-text">计划完成时间</text>

  <rect x="1080" y="645" width="220" height="93" rx="12" fill="#fff2f2" stroke="#d26969" stroke-width="1.7"/>
  <text x="1190" y="670" text-anchor="middle" class="box-title" fill="#9e3535">真人确认决议</text>
  <text x="1190" y="692" text-anchor="middle" class="box-text">未确认：仅是草案，不得生效</text>
  <text x="1190" y="711" text-anchor="middle" class="box-text">已确认：可转任务进入执行</text>

