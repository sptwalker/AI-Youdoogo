  <text x="142" y="445" text-anchor="middle" class="lane-no" fill="#6a4cbd">2</text>
  <text x="142" y="475" text-anchor="middle" class="lane-title" fill="#5b43a4">提案决策</text>
  <text x="142" y="497" text-anchor="middle" class="lane-note">想法 → 预研 → 真人决策</text>
