  <text x="357" y="501" text-anchor="middle" class="box-text">优先级 · 所属部门</text>

  <rect x="470" y="435" width="165" height="93" rx="12" fill="#ffffff" stroke="#b29ee8"/>
  <text x="552" y="460" text-anchor="middle" class="box-title">AI 会前预研</text>
  <text x="552" y="482" text-anchor="middle" class="box-text">可行性 · 收益 · 风险</text>
  <text x="552" y="501" text-anchor="middle" class="box-text">只产生参考结论</text>

  <rect x="665" y="435" width="165" height="93" rx="12" fill="#ffffff" stroke="#b29ee8"/>
  <text x="747" y="460" text-anchor="middle" class="box-title">AI 自查与修订</text>
  <text x="747" y="482" text-anchor="middle" class="box-text">按标准评分并找问题</text>
  <text x="747" y="501" text-anchor="middle" class="box-text">低分时重写后再呈现</text>

  <rect x="860" y="435" width="165" height="93" rx="12" fill="#fff2f2" stroke="#d26969" stroke-width="1.7"/>
  <text x="942" y="460" text-anchor="middle" class="box-title" fill="#9e3535">真人评审</text>
  <text x="942" y="482" text-anchor="middle" class="box-text">通过 / 驳回</text>
  <text x="942" y="501" text-anchor="middle" class="box-text">真人拥有最终决定权</text>

  <rect x="1055" y="435" width="245" height="93" rx="12" fill="#ffffff" stroke="#a894df"/>
  <text x="1177" y="460" text-anchor="middle" class="box-title">通过后转为落地任务</text>
  <text x="1177" y="482" text-anchor="middle" class="box-text">驳回：关闭或修改后重新发起</text>
  <text x="1177" y="501" text-anchor="middle" class="box-text">通过：创建任务卡并进入执行</text>

