  <text x="1200" y="965" text-anchor="middle" class="box-text">身份 · 权限 · 数据范围 · 风险分级</text>
  <text x="1200" y="986" text-anchor="middle" class="box-text">预算 · 真人审批 · 内容安全 · 审计</text>
  <text x="1200" y="1007" text-anchor="middle" class="box-text">高风险动作默认拒绝，凭据最小授权</text>

  <rect x="1380" y="915" width="290" height="105" rx="14" fill="#fff3e9" stroke="#df9456"/>
