      .subtitle { font-size: 14px; fill: #62758a; }
      .section-title { font-size: 19px; font-weight: 700; }
      .lane-no { font-size: 30px; font-weight: 800; }
      .lane-title { font-size: 19px; font-weight: 700; }
      .lane-note { font-size: 12px; fill: #5f7388; }
      .box-title { font-size: 14px; font-weight: 700; }
      .box-text { font-size: 11px; fill: #52677c; }
      .small { font-size: 11px; fill: #5c6f82; }
      .edge-label { font-size: 11px; font-weight: 600; fill: #40566f; }
      .main-edge { fill: none; stroke: #40566f; stroke-width: 2.2; marker-end: url(#arrow); }
      .event-edge { fill: none; stroke: #2f6fed; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-blue); }
      .feedback-edge { fill: none; stroke: #d96b20; stroke-width: 2.3; stroke-dasharray: 7 6; marker-end: url(#arrow-orange); }
    </style>
  </defs>

