<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img" aria-labelledby="title desc">
  <title id="title">企业智能体核心 DDD 限界上下文映射图</title>
  <desc id="desc">工程视角。上半部分展示从业务意图、工作规划、工作流运行、智能体执行、能力执行到目标业务上下文的主协作链路；中部展示上下文与记忆、治理和人工智能运营上下文；底部展示只负责技术实现的平台与启动装配。每个限界上下文都标明自己的核心写入所有权。</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#17324d" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#40566f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c83c3c"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d96b20"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #62758a; }
      .section-title { font-size: 18px; font-weight: 700; }
      .section-note { font-size: 12px; fill: #66788a; }
      .kind { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #718096; }
      .card-title { font-size: 16px; font-weight: 700; }
      .owner { font-size: 11px; fill: #52677c; }
      .small-title { font-size: 14px; font-weight: 700; }
      .small { font-size: 11px; fill: #5c6f82; }
      .edge-label { font-size: 11px; font-weight: 600; fill: #40566f; }
      .sync { fill: none; stroke: #40566f; stroke-width: 2.2; marker-end: url(#arrow); }
      .event { fill: none; stroke: #2f6fed; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-blue); }
      .policy { fill: none; stroke: #c83c3c; stroke-width: 2; stroke-dasharray: 3 5; marker-end: url(#arrow-red); }
      .context { fill: none; stroke: #b7791f; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-amber); }
      .feedback { fill: none; stroke: #d96b20; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1800" height="1150" fill="#f8fafc"/>
  <text x="900" y="42" text-anchor="middle" class="title">企业智能体核心 DDD 限界上下文映射图</text>
  <text x="900" y="68" text-anchor="middle" class="subtitle">工程视角：每个限界上下文拥有自己的模型和写入数据；跨上下文只通过发布语言、端口和事件协作</text>

  <!-- Legend -->
  <g transform="translate(505,94)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#40566f" stroke-width="2.2"/>
    <text x="55" y="4" class="small">命令 / 查询</text>
    <line x1="175" y1="0" x2="220" y2="0" stroke="#2f6fed" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="230" y="4" class="small">领域 / 集成事件</text>
    <line x1="390" y1="0" x2="435" y2="0" stroke="#c83c3c" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="445" y="4" class="small">身份 / 策略 / 审核</text>
    <line x1="620" y1="0" x2="665" y2="0" stroke="#b7791f" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="675" y="4" class="small">上下文供给</text>
  </g>

  <!-- Main value flow panel -->
  <rect x="40" y="120" width="1720" height="300" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="65" y="151" class="section-title">核心协作链路</text>
  <text x="65" y="170" class="section-note">箭头表示跨上下文契约，不表示允许直接引用对方的领域模型、ORM 或内部服务</text>

  <!-- Main flow arrows below the cards -->
  <path d="M320 245 L355 245" class="sync"/>
  <path d="M585 245 L620 245" class="sync"/>
  <path d="M850 245 L885 245" class="sync"/>
  <path d="M1115 245 L1150 245" class="sync"/>
  <path d="M1380 245 L1415 245" class="sync"/>
  <text x="337" y="234" text-anchor="middle" class="edge-label">意图</text>
  <text x="602" y="234" text-anchor="middle" class="edge-label">计划</text>
  <text x="867" y="234" text-anchor="middle" class="edge-label">执行步骤</text>
  <text x="1132" y="234" text-anchor="middle" class="edge-label">能力请求</text>
  <text x="1397" y="234" text-anchor="middle" class="edge-label">业务命令</text>

  <path d="M1555 185 L1555 140 L195 140 L195 185" class="event"/>
  <text x="875" y="134" text-anchor="middle" class="edge-label" fill="#2f6fed">进度 · 交付物 · 执行证据 · 待决事项</text>

  <!-- Business and communication group -->
  <g filter="url(#shadow)">
    <rect x="70" y="185" width="250" height="185" rx="16" fill="#eef5ff" stroke="#5f9be3" stroke-width="1.9"/>
  </g>
  <text x="90" y="208" class="kind">业务场景与沟通上下文</text>
  <text x="90" y="232" class="card-title">意图来源与结果窗口</text>
  <rect x="90" y="248" width="210" height="27" rx="8" fill="#ffffff" stroke="#9ec2ef"/>
  <text x="105" y="266" class="small-title">助理会话</text><text x="195" y="266" class="small">拥有会话与消息</text>
  <rect x="90" y="282" width="210" height="27" rx="8" fill="#ffffff" stroke="#9ec2ef"/>
  <text x="105" y="300" class="small-title">提案管理</text><text x="195" y="300" class="small">拥有提案生命周期</text>
  <rect x="90" y="316" width="210" height="27" rx="8" fill="#ffffff" stroke="#9ec2ef"/>
  <text x="105" y="334" class="small-title">会议管理</text><text x="195" y="334" class="small">拥有会议与决议</text>
  <text x="195" y="361" text-anchor="middle" class="owner">运营分析等业务上下文继续拥有各自业务事实</text>

  <!-- Work planning -->
  <g filter="url(#shadow)">
    <rect x="355" y="185" width="230" height="115" rx="15" fill="#f3efff" stroke="#9275d8" stroke-width="1.9"/>
  </g>
  <text x="375" y="207" class="kind">限界上下文</text>
  <text x="375" y="232" class="card-title">工作规划</text>
  <text x="375" y="256" class="owner">拥有：工作意图、工作流计划、计划步骤</text>
  <text x="375" y="277" class="owner">职责：拆解目标、定义验收条件与依赖</text>

  <!-- Workflow runtime -->
  <g filter="url(#shadow)">
    <rect x="620" y="185" width="230" height="115" rx="15" fill="#f3efff" stroke="#9275d8" stroke-width="1.9"/>
    <rect x="620" y="325" width="230" height="65" rx="13" fill="#fbf9ff" stroke="#ad98e0" stroke-width="1.6"/>
  </g>
  <text x="640" y="207" class="kind">限界上下文</text>
  <text x="640" y="232" class="card-title">工作流运行</text>
  <text x="640" y="256" class="owner">拥有：运行、步骤、事件、租约、执行次数</text>
  <text x="640" y="277" class="owner">职责：持久执行、暂停、恢复与真人停点</text>
  <text x="640" y="345" class="kind">限界上下文</text>
  <text x="640" y="367" class="small-title">任务管理</text>
  <text x="735" y="367" class="owner">拥有任务卡、验收与驳回</text>
  <path d="M735 300 L735 325" class="event"/>
  <text x="747" y="317" class="edge-label" fill="#2f6fed">进度 / 接受事件</text>

  <!-- Agent execution -->
  <g filter="url(#shadow)">
    <rect x="885" y="185" width="230" height="115" rx="15" fill="#eaf8f4" stroke="#55af94" stroke-width="1.9"/>
  </g>
  <text x="905" y="207" class="kind">限界上下文</text>
  <text x="905" y="232" class="card-title">智能体执行</text>
  <text x="905" y="256" class="owner">拥有：单次智能体执行请求、结果与追踪</text>
  <text x="905" y="277" class="owner">消费专家快照，不拥有专家或工作流规则</text>

  <!-- Capability execution -->
  <g filter="url(#shadow)">
    <rect x="1150" y="185" width="230" height="115" rx="15" fill="#eaf8f4" stroke="#55af94" stroke-width="1.9"/>
    <rect x="1150" y="325" width="230" height="65" rx="13" fill="#f6fffb" stroke="#79bea9" stroke-width="1.6"/>
  </g>
  <text x="1170" y="207" class="kind">限界上下文</text>
  <text x="1170" y="232" class="card-title">能力执行</text>
  <text x="1170" y="256" class="owner">拥有：能力调用、工具执行、幂等与回执</text>
  <text x="1170" y="277" class="owner">职责：校验、授权、分派与结果归一</text>
  <text x="1170" y="345" class="kind">限界上下文</text>
  <text x="1170" y="367" class="small-title">能力目录</text>
  <text x="1255" y="367" class="owner">拥有能力定义、版本与风险声明</text>
  <path d="M1265 300 L1265 325" class="sync"/>
  <text x="1277" y="317" class="edge-label">定义查询</text>

  <!-- Target contexts -->
  <g filter="url(#shadow)">
    <rect x="1415" y="185" width="305" height="185" rx="16" fill="#eaf8fa" stroke="#55aeba" stroke-width="1.9"/>
  </g>
  <text x="1435" y="208" class="kind">目标限界上下文</text>
  <text x="1435" y="232" class="card-title">执行业务动作并持有结果</text>
  <rect x="1435" y="248" width="265" height="31" rx="8" fill="#ffffff" stroke="#96cbd2"/>
  <text x="1450" y="268" class="small-title">来源业务用例</text><text x="1570" y="268" class="small">拥有业务状态与不变量</text>
  <rect x="1435" y="286" width="265" height="31" rx="8" fill="#ffffff" stroke="#96cbd2"/>
  <text x="1450" y="306" class="small-title">交付与协作</text><text x="1560" y="306" class="small">拥有交付物与协作请求</text>
  <rect x="1435" y="324" width="265" height="31" rx="8" fill="#ffffff" stroke="#96cbd2"/>
  <text x="1450" y="344" class="small-title">连接器与数据查询</text><text x="1590" y="344" class="small">拥有调用/查询记录</text>

  <!-- Policy checkpoints between main and supporting panels -->
  <path d="M1095 450 L1095 405 L470 405 L470 300" class="policy"/>
  <path d="M1095 405 L1265 405 L1265 300" class="policy"/>
  <path d="M1265 405 L1568 405 L1568 370" class="policy"/>
  <text x="920" y="398" text-anchor="middle" class="edge-label" fill="#a63838">身份主体 · 策略决定 · 审核决定</text>

  <!-- Context snapshot paths -->
  <path d="M200 505 L200 435 L470 435 L470 300" class="context"/>
  <path d="M330 550 L1000 550 L1000 300" class="context"/>
  <text x="640" y="544" text-anchor="middle" class="edge-label" fill="#9b6818">上下文查询 / 上下文快照</text>

  <!-- Context and memory panel -->
  <rect x="40" y="450" width="830" height="325" rx="22" fill="#fff8e5" stroke="#dfbd67" stroke-width="1.8"/>
  <text x="65" y="481" class="section-title" fill="#946211">上下文与组织记忆</text>
  <text x="65" y="500" class="section-note">多个限界上下文协作形成统一读取入口，不建立共享写模型</text>

  <g filter="url(#shadow)">
    <rect x="70" y="525" width="260" height="115" rx="15" fill="#ffffff" stroke="#cf9f37" stroke-width="1.9"/>
  </g>
  <text x="90" y="548" class="kind">限界上下文</text>
  <text x="90" y="573" class="card-title">环境投影</text>
  <text x="90" y="597" class="owner">拥有：上下文快照的组合、版本与失效状态</text>
  <text x="90" y="618" class="owner">输出：带身份范围、来源、版本和过期策略的快照</text>

  <rect x="370" y="525" width="145" height="60" rx="11" fill="#ffffff" stroke="#d3ad54"/>
  <rect x="530" y="525" width="145" height="60" rx="11" fill="#ffffff" stroke="#d3ad54"/>
  <rect x="690" y="525" width="145" height="60" rx="11" fill="#ffffff" stroke="#d3ad54"/>
  <rect x="370" y="600" width="145" height="60" rx="11" fill="#ffffff" stroke="#d3ad54"/>
  <rect x="530" y="600" width="145" height="60" rx="11" fill="#ffffff" stroke="#d3ad54"/>
  <rect x="690" y="600" width="145" height="60" rx="11" fill="#ffffff" stroke="#d3ad54"/>
  <text x="442" y="548" text-anchor="middle" class="small-title">知识库与索引</text><text x="442" y="569" text-anchor="middle" class="small">拥有文档/索引生命周期</text>
  <text x="602" y="548" text-anchor="middle" class="small-title">知识检索与语义目录</text><text x="602" y="569" text-anchor="middle" class="small">拥有召回、排序与引用</text>
  <text x="762" y="548" text-anchor="middle" class="small-title">组织记忆</text><text x="762" y="569" text-anchor="middle" class="small">拥有记忆条目与来源</text>
  <text x="442" y="623" text-anchor="middle" class="small-title">组织结构</text><text x="442" y="644" text-anchor="middle" class="small">拥有部门、岗位与归属</text>
  <text x="602" y="623" text-anchor="middle" class="small-title">专家管理</text><text x="602" y="644" text-anchor="middle" class="small">拥有专家生命周期与快照</text>
  <text x="762" y="623" text-anchor="middle" class="small-title">能力目录</text><text x="762" y="644" text-anchor="middle" class="small">拥有能力定义与版本</text>

  <path d="M370 592 L345 592 L345 585 L330 585" class="context"/>
  <text x="455" y="690" text-anchor="middle" class="small" fill="#8c6114">各来源上下文通过受控查询供给；环境投影只组合快照，不取得来源事实写入权</text>
  <rect x="70" y="710" width="765" height="40" rx="10" fill="#fffdf7" stroke="#d8ba73" stroke-dasharray="6 5"/>
  <text x="452" y="735" text-anchor="middle" class="small-title" fill="#8c6114">单一写入所有权：向量库、数据湖和上下文快照都不会自动成为业务事实所有者</text>

  <!-- Governance panel -->
  <rect x="900" y="450" width="400" height="325" rx="22" fill="#fff0f0" stroke="#dfa1a1" stroke-width="1.8"/>
  <text x="925" y="481" class="section-title" fill="#9b3434">治理限界上下文</text>
  <text x="925" y="500" class="section-note">只提供身份、决策和审计证据，不能越权修改来源业务对象</text>

  <rect x="930" y="525" width="160" height="62" rx="11" fill="#ffffff" stroke="#ce7373"/>
  <rect x="1110" y="525" width="160" height="62" rx="11" fill="#ffffff" stroke="#ce7373"/>
  <rect x="930" y="602" width="160" height="62" rx="11" fill="#ffffff" stroke="#ce7373"/>
  <rect x="1110" y="602" width="160" height="62" rx="11" fill="#ffffff" stroke="#ce7373"/>
  <rect x="930" y="679" width="340" height="62" rx="11" fill="#ffffff" stroke="#ce7373"/>
  <text x="1010" y="548" text-anchor="middle" class="small-title">身份</text><text x="1010" y="569" text-anchor="middle" class="small">拥有用户身份与登录状态</text>
  <text x="1190" y="548" text-anchor="middle" class="small-title">访问控制</text><text x="1190" y="569" text-anchor="middle" class="small">拥有授权规则与策略决定</text>
  <text x="1010" y="625" text-anchor="middle" class="small-title">人工审核</text><text x="1010" y="646" text-anchor="middle" class="small">拥有审核请求与决定</text>
  <text x="1190" y="625" text-anchor="middle" class="small-title">审计追踪</text><text x="1190" y="646" text-anchor="middle" class="small">拥有只追加的审计记录</text>
  <text x="1100" y="702" text-anchor="middle" class="small-title">系统配置</text><text x="1100" y="723" text-anchor="middle" class="small">拥有配置版本、密钥状态与变更历史</text>

  <!-- AI operations panel -->
  <rect x="1330" y="450" width="430" height="325" rx="22" fill="#fff3e9" stroke="#e7aa74" stroke-width="1.8"/>
  <text x="1355" y="481" class="section-title" fill="#a9571d">人工智能运营与反馈</text>
  <text x="1355" y="500" class="section-note">接收模型用量、执行证据、业务结果和人工反馈</text>

  <rect x="1360" y="525" width="370" height="58" rx="11" fill="#ffffff" stroke="#dd8d4c"/>
  <rect x="1360" y="600" width="370" height="58" rx="11" fill="#ffffff" stroke="#dd8d4c"/>
  <rect x="1360" y="675" width="370" height="58" rx="11" fill="#ffffff" stroke="#dd8d4c"/>
  <text x="1378" y="548" class="small-title">模型供应商管理</text><text x="1510" y="548" class="small">拥有模型路由、启停与凭据密文</text>
  <text x="1378" y="623" class="small-title">用量与预算</text><text x="1490" y="623" class="small">拥有用量账本、成本归因与预算策略</text>
  <text x="1378" y="698" class="small-title">人工智能质量</text><text x="1510" y="698" class="small">拥有评估、反馈归因、影子评估与候选改进</text>
  <path d="M1690 746 L1370 746" class="feedback"/>
  <text x="1530" y="766" text-anchor="middle" class="small" fill="#b85b1c">经验证候选必须回到所属上下文审批、发布和回滚</text>

  <!-- Platform panel -->
  <rect x="40" y="815" width="1720" height="275" rx="22" fill="#eef1f4" stroke="#98a6b5" stroke-width="1.8"/>
  <text x="65" y="848" class="section-title" fill="#526579">平台与启动装配（外层技术细节）</text>
  <text x="65" y="869" class="section-note">限界上下文定义所需端口，平台实现端口；数据库、网络协议和供应商 SDK 不拥有领域事实</text>

  <rect x="70" y="895" width="310" height="78" rx="13" fill="#ffffff" stroke="#a9b4bf"/>
  <rect x="405" y="895" width="310" height="78" rx="13" fill="#ffffff" stroke="#a9b4bf"/>
  <rect x="740" y="895" width="310" height="78" rx="13" fill="#ffffff" stroke="#a9b4bf"/>
  <rect x="1075" y="895" width="310" height="78" rx="13" fill="#ffffff" stroke="#a9b4bf"/>
  <rect x="1410" y="895" width="310" height="78" rx="13" fill="#ffffff" stroke="#a9b4bf"/>
  <text x="225" y="924" text-anchor="middle" class="small-title">启动装配</text><text x="225" y="946" text-anchor="middle" class="small">应用启动 · 生命周期 · 依赖装配</text><text x="225" y="963" text-anchor="middle" class="small">入口与处理器注册</text>
  <text x="560" y="924" text-anchor="middle" class="small-title">HTTP / SSE / MCP 运行时</text><text x="560" y="946" text-anchor="middle" class="small">协议传输 · 超时 · 重试 · 连接池</text><text x="560" y="963" text-anchor="middle" class="small">入站与出站适配</text>
  <text x="895" y="924" text-anchor="middle" class="small-title">LLM 网关</text><text x="895" y="946" text-anchor="middle" class="small">供应商 SDK · 主备切换 · 熔断</text><text x="895" y="963" text-anchor="middle" class="small">只实现模型调用端口</text>
  <text x="1230" y="924" text-anchor="middle" class="small-title">PostgreSQL / Redis / Outbox</text><text x="1230" y="946" text-anchor="middle" class="small">仓储适配 · 租约 · 事件传输</text><text x="1230" y="963" text-anchor="middle" class="small">持久化不是领域所有权</text>
  <text x="1565" y="924" text-anchor="middle" class="small-title">对象存储 / 沙箱 / 可观测 / 安全</text><text x="1565" y="946" text-anchor="middle" class="small">凭据解析 · 加密签名 · 遥测</text><text x="1565" y="963" text-anchor="middle" class="small">技术机制与运行保障</text>

