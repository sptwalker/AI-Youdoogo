# 前端 Nginx：SPA 静态托管 + /api 反向代理到后端（同 compose 网络内服务名 backend）
server {
    listen 80;
    server_name _;

    # 上传/大模型接口耗时较长，放宽超时与请求体上限
    client_max_body_size 50m;

    location /api/ {
        # 用 Docker 内嵌 DNS + 变量 proxy_pass，让 backend 主机名在「请求时」解析，
        # 避免 nginx 启动时因 backend 尚未就绪而解析失败、整个前端容器起不来。
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # SSE 流式（桌面对话/编排进度/会商 AI 发言）：关缓冲 + HTTP/1.1 长连，
        # 否则 nginx 默认 proxy_buffering on 会把逐字流缓冲住，前端收不到实时 delta。
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA：静态资源 + 前端路由回退到 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
