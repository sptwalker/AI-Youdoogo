# 前端 Nginx 模板：Compose 默认 backend，CCE 由 Deployment 覆盖 BACKEND_HOST。
map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;

    # 上传/大模型接口耗时较长，放宽超时与请求体上限
    client_max_body_size 50m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # OAuth code/state 只在回调处理内存中使用，禁止进入 Nginx access log。
    # Uvicorn 侧另由 ASGI middleware 清除 query 后再写 access log。
    location = /api/v1/auth/feishu/callback {
        access_log off;
        # proxy_pass 不附带 URI，原始回调路径与 query 会原样传给 backend。
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # SSE 流式（桌面对话/编排进度/会商 AI 发言）：关缓冲 + HTTP/1.1 长连，
        # 否则 nginx 默认 proxy_buffering on 会把逐字流缓冲住，前端收不到实时 delta。
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA：静态资源 + 前端路由回退到 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
